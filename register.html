<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Register • AInswer.co</title>
  <link rel="stylesheet" href="assets/styles.css"/>
  <script src="assets/app.js"></script>
  <style>
    /* ── Password strength meter ── */
    .pw-rules { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
    .pw-rule  { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted, #888); transition: color .2s; }
    .pw-rule.ok { color: #10b981; }
    .pw-rule .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

    .strength-bar { height: 4px; border-radius: 2px; background: #e2e8f0; margin-top: 8px; overflow: hidden; }
    .strength-bar-fill { height: 100%; border-radius: 2px; transition: width .3s, background .3s; width: 0; }

    /* ── Username status ── */
    .username-status { font-size: 12px; margin-top: 5px; min-height: 16px; font-weight: 500; }
    .username-status.ok   { color: #10b981; }
    .username-status.err  { color: #f43f5e; }
    .username-status.checking { color: #888; }

    /* ── Confirm password ── */
    .confirm-status { font-size: 12px; margin-top: 5px; min-height: 16px; }
    .confirm-status.ok  { color: #10b981; }
    .confirm-status.err { color: #f43f5e; }
  </style>
</head>
<body>
<nav>
  <div class="container nav-inner">
    <a class="brand" href="index.html"><span class="logo"></span><span>AInswer.co</span></a>
    <div class="nav-links">
      <a href="pricing.html">Pricing</a>
      <a href="demo.html">Demo</a>
      <a class="btn ghost" href="login.html">Log in</a>
      <a class="btn primary" href="register.html">Start free trial</a>
    </div>
  </div>
</nav>


<section class="section">
  <div class="container">
    <h1 class="h1" style="font-size:38px">Create your account</h1>
    <p class="sub">Get started with AInswer — your AI voice agent platform.</p>
    <div class="divider"></div>
    <div class="card padded">
      <form class="form" id="registerForm">

        <div class="row">
          <div><label>Your name</label><input name="name" required placeholder="Owner name"/></div>
          <div><label>Business name</label><input name="businessName" required placeholder="e.g. ABC Plumbing"/></div>
        </div>

        <!-- Username with real-time availability -->
        <div>
          <label>Username</label>
          <input name="username" id="usernameInput" required placeholder="Choose a unique username" autocomplete="off"/>
          <div class="username-status" id="usernameStatus"></div>
        </div>

        <div class="row">
          <div><label>Email</label><input name="email" required type="email" placeholder="you@company.com"/></div>
          <div><label>Mobile (for SMS)</label><input name="phone" placeholder="+44..."/></div>
        </div>

        <div class="row">
          <div><label>Industry</label>
            <select name="industry">
              <option>Trades</option><option>Clinic</option><option>Property</option><option>Garage</option><option>Transport</option><option selected>Other</option>
            </select>
          </div>
          <div><label>Timezone</label><input name="timezone" value="Europe/London"/></div>
        </div>

        <!-- Password with strength meter -->
        <div>
          <label>Password</label>
          <input name="password" id="passwordInput" required type="password" placeholder="Create a strong password"/>
          <div class="strength-bar"><div class="strength-bar-fill" id="strengthFill"></div></div>
          <div class="pw-rules" id="pwRules">
            <div class="pw-rule" id="rule-len"><span class="dot"></span> At least 8 characters</div>
            <div class="pw-rule" id="rule-upper"><span class="dot"></span> One uppercase letter (A–Z)</div>
            <div class="pw-rule" id="rule-num"><span class="dot"></span> One number (0–9)</div>
            <div class="pw-rule" id="rule-special"><span class="dot"></span> One special character (!@#$...)</div>
          </div>
        </div>

        <!-- Confirm password -->
        <div>
          <label>Confirm password</label>
          <input id="confirmInput" required type="password" placeholder="Re-enter your password"/>
          <div class="confirm-status" id="confirmStatus"></div>
        </div>

        <button class="btn primary" type="submit" id="registerBtn">Create account</button>
        <div class="small">Already have an account? <a href="login.html">Log in</a></div>
      </form>
    </div>
  </div>
</section>

<script>
  // ── Password strength ──────────────────────────────────────────
  const pwInput   = document.getElementById('passwordInput');
  const fillBar   = document.getElementById('strengthFill');
  const ruleLen   = document.getElementById('rule-len');
  const ruleUpper = document.getElementById('rule-upper');
  const ruleNum   = document.getElementById('rule-num');
  const ruleSpec  = document.getElementById('rule-special');

  pwInput.addEventListener('input', () => {
    const v = pwInput.value;
    const checks = {
      len:     v.length >= 8,
      upper:   /[A-Z]/.test(v),
      num:     /[0-9]/.test(v),
      special: /[^A-Za-z0-9]/.test(v)
    };

    ruleLen.classList.toggle('ok',   checks.len);
    ruleUpper.classList.toggle('ok', checks.upper);
    ruleNum.classList.toggle('ok',   checks.num);
    ruleSpec.classList.toggle('ok',  checks.special);

    const score = Object.values(checks).filter(Boolean).length;
    const colors = ['#f43f5e','#fb923c','#facc15','#10b981'];
    fillBar.style.width = (score * 25) + '%';
    fillBar.style.background = colors[score - 1] || '#e2e8f0';

    checkConfirm();
  });

  // ── Confirm password ───────────────────────────────────────────
  const confirmInput  = document.getElementById('confirmInput');
  const confirmStatus = document.getElementById('confirmStatus');

  function checkConfirm() {
    if (!confirmInput.value) { confirmStatus.textContent = ''; return; }
    if (confirmInput.value === pwInput.value) {
      confirmStatus.textContent = '✓ Passwords match';
      confirmStatus.className = 'confirm-status ok';
    } else {
      confirmStatus.textContent = '✗ Passwords do not match';
      confirmStatus.className = 'confirm-status err';
    }
  }
  confirmInput.addEventListener('input', checkConfirm);

  // ── Username availability (debounced 1.2s) ─────────────────────
  const usernameInput  = document.getElementById('usernameInput');
  const usernameStatus = document.getElementById('usernameStatus');
  let usernameTimer = null;
  let usernameAvailable = false;

  usernameInput.addEventListener('input', () => {
    clearTimeout(usernameTimer);
    const val = usernameInput.value.trim();
    if (!val) { usernameStatus.textContent = ''; usernameAvailable = false; return; }

    usernameStatus.textContent = 'Checking...';
    usernameStatus.className = 'username-status checking';

    usernameTimer = setTimeout(async () => {
      try {
        const resp = await fetch(`${AInswer.API_BASE}/api/check-username?username=${encodeURIComponent(val)}`, {
          headers: { 'accept': 'application/json' }
        });
        const data = await resp.json();
        // API returns { available: true/false } or just true/false
        if (data.available === true || data === true) {
          usernameStatus.textContent = '✓ Available';
          usernameStatus.className = 'username-status ok';
          usernameAvailable = true;
        } else {
          usernameStatus.textContent = '✗ Username already taken';
          usernameStatus.className = 'username-status err';
          usernameAvailable = false;
        }
      } catch {
        usernameStatus.textContent = 'Could not check — try a different username';
        usernameStatus.className = 'username-status err';
        usernameAvailable = false;
      }
    }, 1200);
  });

  // ── Block submit if validations fail (capture phase = before handleRegister) ──
  document.getElementById('registerForm').addEventListener('submit', (e) => {
    const pw = pwInput.value;
    const allPassed = pw.length >= 8 && /[A-Z]/.test(pw) && /[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw);
    if (!allPassed) {
      e.stopImmediatePropagation(); e.preventDefault();
      alert('Please create a strong password meeting all requirements.');
      return;
    }
    if (confirmInput.value !== pw) {
      e.stopImmediatePropagation(); e.preventDefault();
      alert('Passwords do not match.');
      return;
    }
    if (!usernameAvailable) {
      e.stopImmediatePropagation(); e.preventDefault();
      alert('Please choose an available username.');
      return;
    }
  }, true);

  // Clear any previous session the moment this page loads
  if (typeof AInswer !== 'undefined') AInswer.clearSession();
  AInswer.handleRegister("registerForm");
</script>
</body>
</html>
