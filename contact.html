<section class="section">
  <div class="container">
    <h1 class="h1" style="font-size:38px">Contact</h1>
    <p class="sub">Demo contact form (shows functional form behaviour without backend).</p>
    <div class="divider"></div>
    <div class="card padded">
      <form class="form" id="contactForm">
        <div class="row">
          <div><label>Name</label><input name="name" required/></div>
          <div><label>Email</label><input name="email" type="email" required/></div>
        </div>
        <label>Message</label><textarea name="message" required></textarea>
        <button class="btn primary" type="submit">Send</button>
      </form>
      <div class="notice" style="margin-top:10px">Demo: this stores your message locally. Production: send email + CRM entry.</div>
    </div>
  </div>
</section>
<script>
document.getElementById("contactForm").addEventListener("submit",(e)=>{
  e.preventDefault();
  const data=Object.fromEntries(new FormData(e.target).entries());
  const msgs=LS.get("ainswer_contact_messages",[]);
  msgs.push({id:uid("msg"),...data,time:new Date().toISOString()});
  LS.set("ainswer_contact_messages",msgs);
  alert("Message saved locally (demo).");
  e.target.reset();
});
</script>
