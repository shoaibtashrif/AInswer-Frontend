</head>
<body>
<nav>
  <div class="container nav-inner">
    <a class="brand" href="/dashboard"><span class="logo"></span><span>AInswer.co Portal</span></a>
    <div class="nav-links">
      <span class="small" id="portalUser"></span>
      <button class="btn danger" onclick="logout()">Log out</button>
    </div>
  </div>
</nav>
<section class="container">
  <div class="layout">
    
<div class="sidebar card padded" style="box-shadow:none">
  <a data-nav href="/dashboard">Dashboard</a>
  <a data-nav href="go-live.html">Go Live</a>

    <div>
<h1 class="h2">Settings</h1>
<div class="p" style="margin-bottom: 20px;">Manage your account-level configuration and global notifications.</div>
<div class="divider"></div>
<form class="form" id="settingsForm">
  <label>Business name</label><input name="business_name"/>
  <label>Industry</label><select name="industry">
    <option>Trades</option><option>Clinic</option><option>Property</option><option>Garage</option><option>Transport</option><option>Other</option>
  </select>
  <label>Mode</label>
  <select name="mode"><option value="overflow">Overflow</option><option value="always">24/7</option><option value="hybrid">Hybrid</option></select>
  <label>Ring timeout (seconds)</label><input name="ring_timeout" type="number"/>
  <label>Timezone</label><input name="timezone"/>
  <label>Services</label><textarea name="services"></textarea>
  <label>Location</label><input name="location"/>
  <label>Business hours</label><input name="hours"/>

  <div class="divider"></div>
  <h3 class="h3">Notifications</h3>
  <div class="p small" style="margin-bottom:15px">Configure where you receive critical alerts and call summaries.</div>
  
  <div class="card padded" style="background:var(--panel)">
    <label style="display:flex;gap:8px;align-items:center; font-weight:600;"><input type="checkbox" name="sms_notifications_enabled"/> Enable SMS Alerts</label>
    <div style="margin-top:10px">
      <label class="small muted">SMS Target Number</label>
      <input name="sms_to_number" placeholder="+1234567890" />
    </div>
  </div>

  <div class="card padded" style="background:var(--panel); margin-top:15px">
    <label style="display:flex;gap:8px;align-items:center; font-weight:600;"><input type="checkbox" name="email_notifications_enabled"/> Enable Email Alerts</label>
    <div style="margin-top:10px">
      <label class="small muted">Email Address</label>
      <input name="email_to_address" placeholder="manager@example.com" type="email" />
    </div>
  </div>

  <div class="card padded" style="background:var(--panel); margin-top:15px">
    <label style="display:flex;gap:8px;align-items:center; font-weight:600;"><input type="checkbox" name="whatsapp_notifications_enabled"/> Enable WhatsApp Alerts</label>
    <div style="margin-top:10px">
      <label class="small muted">WhatsApp Number</label>
      <input name="whatsapp_to_number" placeholder="+1234567890" />
    </div>
  </div>

  <div class="divider"></div>


  <button class="btn primary" type="submit">Save settings</button>
</form>
<script>AInswer.renderSettings("settingsForm");</script>
</div>
  </div>
</section>
<script>
AInswer.requireAuth();
AInswer.setHeaderUser();
AInswer.setActiveNav();
</script>
</body>
</html>
