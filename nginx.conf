server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index login.html;

    # Serve files directly; fall back to login.html (no 404s for direct URL access)
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    # Cache media static assets aggressively
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Revalidate CSS and JS so deployments are picked up immediately
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "no-cache, public";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
