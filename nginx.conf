server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # ── Clean URL routing ──────────────────────────────────────────
    # Root → login page
    location = / {
        try_files /login.html =404;
    }

    # Public auth pages
    location = /login      { try_files /login.html =404; }
    location = /register   { try_files /register.html =404; }
    location = /forgot     { try_files /forgot.html =404; }

    # Marketing pages
    location = /pricing      { try_files /pricing.html =404; }
    location = /demo         { try_files /demo.html =404; }
    location = /how-it-works { try_files /how-it-works.html =404; }
    location = /use-cases    { try_files /use-cases.html =404; }
    location = /compliance   { try_files /compliance.html =404; }
    location = /contact      { try_files /contact.html =404; }

    # App portal pages (live inside /app/ folder)
    location = /app/dashboard   { try_files /app/dashboard.html =404; }
    location = /app/agents      { try_files /app/agents.html =404; }
    location = /app/knowledge   { try_files /app/knowledge.html =404; }
    location = /app/calls       { try_files /app/calls.html =404; }
    location = /app/call-detail { try_files /app/call-detail.html =404; }
    location = /app/settings    { try_files /app/settings.html =404; }
    location = /app/go-live     { try_files /app/go-live.html =404; }
    location = /app/billing     { try_files /app/billing.html =404; }
    location = /app/integrations { try_files /app/integrations.html =404; }

    # Admin pages (live inside /admin/ folder)
    location = /admin/index          { try_files /admin/index.html =404; }
    location = /admin/customers      { try_files /admin/customers.html =404; }
    location = /admin/customer-detail { try_files /admin/customer-detail.html =404; }
    location = /admin/users          { try_files /admin/users.html =404; }
    location = /admin/prompts        { try_files /admin/prompts.html =404; }

    # Serve static files (assets, images, etc.) directly
    location / {
        try_files $uri $uri/ /404.html;
    }

    # 404 fallback page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ── Caching ──────────────────────────────────────────────────
    # Images/fonts — long cache
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # CSS/JS — revalidate on every request (instant deploys)
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Security headers ─────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # ── Gzip ─────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
