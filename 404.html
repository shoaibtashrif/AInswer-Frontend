<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 - Not Found • AInswer.co</title>
  <link rel="stylesheet" href="/assets/styles.css" />
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --accent: #6366f1;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }
    .grid-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: linear-gradient(rgba(99, 102, 241, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: 1;
    }
    .content {
      position: relative;
      z-index: 2;
      max-width: 450px;
      animation: fadeIn 1s ease forwards;
    }
    .num-404 {
      font-size: 130px;
      font-weight: 900;
      line-height: 1;
      margin: 0;
      background: linear-gradient(to right, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: float 4s ease-in-out infinite;
    }
    .title {
      font-size: 24px;
      font-weight: 700;
      margin: 15px 0 10px 0;
    }
    .p {
      font-size: 15px;
      color: #94a3b8;
      margin-bottom: 25px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
      transition: all 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
      background: #4f46e5;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="content">
    <div class="num-404">404</div>
    <div class="title">Lost in space?</div>
    <div class="p">The page you are looking for doesn't exist, has been moved, or doesn't belong to this account.</div>
    <a href="/login" class="btn">Back to Login</a>
  </div>
</body>
</html>
